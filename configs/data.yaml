# Verified external BraTS 2024 GLI post-treatment dataset.
release: BraTS2024-GLI-post-treatment
# Paths are resolved relative to the working directory; CSV paths relative to root.
root: ~/datasets/BraTS2024/train/training_data1_v2
train_manifest: null
val_manifest: null
normalize: true
# Applied only to training; validation/evaluation retain full volumes.
patch_size:
  - 96
  - 96
  - 96
foreground_sampling_probability: 0.7
train_cases: splits/train_cases.txt
val_cases: splits/val_cases.txt

# Training only, after normalized patch extraction.
augmentation:
  enabled: true
  flip:
    enabled: true
    probability: 0.5
  intensity_scale:
    enabled: true
    min: 0.9
    max: 1.1
  intensity_shift:
    enabled: true
    min: -0.1
    max: 0.1
  gaussian_noise:
    enabled: true
    std_min: 0.0
    std_max: 0.05
