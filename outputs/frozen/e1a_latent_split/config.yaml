data:
  normalize: true
  patch_size:
  - 96
  - 96
  - 96
  foreground_sampling_probability: 0.7
  release: BraTS2024-GLI-post-treatment
  root: /home/friend/data/training_data1_v2
  train_manifest: null
  val_manifest: null
  train_cases: splits/train_cases.txt
  val_cases: splits/val_cases.txt
  augmentation:
    enabled: true
    flip:
      enabled: true
      probability: 0.5
    intensity_scale:
      enabled: true
      min: 0.9
      max: 1.1
    intensity_shift:
      enabled: true
      min: -0.1
      max: 0.1
    gaussian_noise:
      enabled: true
      std_min: 0.0
      std_max: 0.05
model:
  name: latent_split_unet3d
  in_channels: 4
  out_channels: 4
  base_channels: 32
  latent_projection: conv1x1x1
  latent_channels: 256
train:
  threshold: 0.5
  epochs: 30
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 1.0e-05
  seed: 42
  num_workers: 4
  device: cuda
  output_dir: outputs/e1a_latent_split
  validation_frequency: 1
  experiment_name: E1-A latent-split control
  resume: outputs/e1a_latent_split/latest.pt
debug: false
selection_metric: mean target-positive case Dice over NETC,SNFH,ET,RC,WT,TC; exclude
  regions with zero positive cases
experiment_name: E1-A latent-split control
segmentation_loss:
  name: Dice+BCE
  dice_weight: 1.0
  bce_weight: 1.0
  dice_smooth: 1.0e-05
optimizer: AdamW
